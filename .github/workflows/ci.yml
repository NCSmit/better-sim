name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select --switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Build the app
        run: ./build.sh

      - name: Test the app
        run: swift test

      - name: Check the build script
        run: bash -n build.sh
