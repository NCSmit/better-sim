name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select --switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Build the app
        run: ./build.sh

      - name: Test the app
        shell: bash
        run: swift test 2>&1 | tee test.log
        timeout-minutes: 12

      - name: Show where the tests stopped
        if: failure()
        run: grep -E "started|passed|failed" test.log | tail -40

      - name: Check the build script
        run: bash -n build.sh
