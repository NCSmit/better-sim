name: Feature request
description: Suggest an idea for BetterSim.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem, or the moment where BetterSim falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What could BetterSim do?
      description: Describe how you picture it working.
    validations:
      required: true
